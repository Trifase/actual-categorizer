[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actual-utils"
version = "0.1.11"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "actualpy>=0.22.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
actualutils = "categorize:run_menu"
cleanup = "cleanup:run_cleanup"
remove-empty-payees = "remove_empty_payees:run_remove_empty"
rules-cleanup = "rules_cleanup:run_rules_cleanup"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel.force-include]
"categorize.py" = "categorize.py"
"cleanup.py" = "cleanup.py"
"remove_empty_payees.py" = "remove_empty_payees.py"
"rules_cleanup.py" = "rules_cleanup.py"
"locales" = "locales"
